<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAYA TIME">
  <meta name="theme-color" content="#14110f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>NAYA TIME – Stempeluhr</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="terminal">
    <header>
      <h1 class="marke">NAYA <b>TIME</b></h1>
      <div class="uhr"><div class="zeit" id="uhr">--:--</div><div class="datum" id="datum"></div></div>
    </header>
    <div class="hinweis-zeile">Tippe auf deinen Namen, um ein- oder auszustempeln.</div>
    <main class="namen" id="namen"><div class="leer">Lade …</div></main>
  </div>

  <div class="overlay" id="pin-overlay">
    <div class="pin-box">
      <div>
        <video class="kamera" id="kamera" autoplay playsinline muted></video>
        <div class="kamera-text" id="kamera-text">Beim Stempeln wird ein Foto gemacht.</div>
      </div>
      <div>
        <h2 class="pin-titel" id="pin-name"></h2>
        <p class="pin-unter" id="pin-unter">PIN eingeben</p>
        <div class="pin-punkte" id="pin-punkte"></div>
        <div class="tasten" id="tasten"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="ergebnis-overlay">
    <div class="ergebnis" id="ergebnis"></div>
  </div>

  <canvas id="leinwand" hidden></canvas>
  <script src="/terminal.js"></script>
</body>
</html>
